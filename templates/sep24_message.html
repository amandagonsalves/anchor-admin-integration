<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ heading }}</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <h1>{{ heading }}</h1>
  <p>{{ body }}</p>
  {% if post_message %}
  <script>
    if (window.opener) {
      window.opener.postMessage({
        transaction: { id: "{{ transaction_id }}", status: "{{ status }}" }
      }, "*");
    }
  </script>
  {% endif %}
</body>
</html>
